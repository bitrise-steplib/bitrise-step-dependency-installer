---
format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  test_tool_versions:
    title: E2E - Single .tool-versions file
    description: Tests installing from a .tool-versions file with multiple tools
    steps:
    - generate-text-file@0:
        inputs:
        - file_name: .tool-versions
        - file_content: nodejs 20.11.1
    - path::./:
        title: Run dependency installer
        inputs:
        - tool_version_file: .tool-versions
        - verbose: "true"
    - bundle::verify_install:
        inputs:
        - TOOL: node
        - VERSION: v20.11.1

  test_bitrise_yml_no_workflow:
    title: E2E - bitrise.yml without workflow
    description: Tests installing from a bitrise.yml with global tools
    steps:
    - generate-text-file@0:
        inputs:
        - file_name: tmp/bitrise.yml
        - file_content: |-
            ---
            format_version: "17"
            default_step_lib_source:
            https://github.com/bitrise-io/bitrise-steplib.git
            project_type: other

            tools:
              nodejs: 20.11.1
    - path::./:
        title: Run dependency installer
        inputs:
        - tool_version_file: tmp/bitrise.yml
        - verbose: "true"
    - bundle::verify_install:
        inputs:
        - TOOL: node
        - VERSION: v20.11.1

  test_bitrise_yml_with_workflow:
    title: E2E - bitrise.yml with workflow
    description: Tests installing from bitrise.yml with workflow tools
    steps:
    - generate-text-file@0:
        inputs:
        - file_name: tmp/bitrise.yml
        - file_content: |-
            ---
            format_version: "17"
            default_step_lib_source:
            https://github.com/bitrise-io/bitrise-steplib.git
            project_type: other

            tools:
              nodejs: 20.11.0

            workflows:
              test:
                tools:
                  nodejs: 20.11.1
    - path::./:
        title: Run dependency installer
        inputs:
        - tool_version_file: tmp/bitrise.yml
        - bitrise_workflow_id: test
        - verbose: "true"
    - bundle::verify_install:
        inputs:
        - TOOL: node
        - VERSION: v20.11.1
step_bundles:
  verify_install:
    steps:
    - script:
        title: Verify tool installation
        inputs:
        - content: |
            #!/bin/bash
            set -ex

            actual_version=$(node --version)
            if [[ "$VERSION" != "${actual_version}" ]]; then
              echo "Expected ${VERSION}. Got ${actual_version}"
              exit 1
            fi
    inputs:
    - TOOL: go
    - VERSION: 1.1.1
