#
# A couple of useful guides & docs:
#
# - Main Bitrise CLI docs: https://github.com/bitrise-io/bitrise/tree/master/_docs
# - Step Development Guideline: https://github.com/bitrise-io/bitrise/blob/master/_docs/step-development-guideline.md
# - Bitrise.yml format spec: https://github.com/bitrise-io/bitrise/blob/master/_docs/bitrise-yml-format-spec.md
# - Bitrise docs: http://devcenter.bitrise.io/
# - Bitrise CLI guides: http://devcenter.bitrise.io/bitrise-cli/

title: |-
  Dependency Installer
summary: |
   Installs dependencies from tool version files in your repo.
description: |
   This wrapper for the bitrise CLI tool installs dependencies defined in the tool version file(s) in your repo.

   To learn more about defining tool versions as code, read our [documentation](https://bitrise.io/stacks/tips/tool-versions#how-to-declare-tool-versions).

   Tool version files supported by this step include:
   * .tool-versions
	 * .ruby-version
	 * .node-version
	 * .python-version
	 * .java-version
	 * .go-version
	 * .terraform-version
	 * .kubectl-version
   * bitrise.yml (with a `tools:` section)

website: https://github.com/bitrise-io/bitrise-step-dependency-installer
source_code_url: https://github.com/bitrise-io/bitrise-step-dependency-installer
support_url: https://github.com/bitrise-io/bitrise-step-dependency-installer/issues

# If this step should be available only for certain project types
# just uncomment this `project_type_tags` section and include all the
# project types supported by the step. If the step can be used for all
# project types then you can just remove this section.
# If no `project_type_tags` specified (or specified as an empty array)
# that means the step can be used for any project type.
# You can find more information about project type tags in the Step Development Guideline:
# https://github.com/bitrise-io/bitrise/blob/master/_docs/step-development-guideline.md

project_type_tags:
  - ios
  - macos
  - android
  - xamarin
  - react-native
  - cordova
  - ionic
  - flutter

# Type tags are used for categorizing steps, for easier step discovery in Step Libraries.
# You can find more information about type tags in the Step Development Guideline:
# https://github.com/bitrise-io/bitrise/blob/master/_docs/step-development-guideline.md
type_tags:
  - installer

# These properties define whether a Step is run in a given Workflow or not.
# You can find more information about this in the documentation here:
# https://devcenter.bitrise.io/en/steps-and-workflows/developing-your-own-bitrise-step/developing-a-new-step.html#setting-conditions-for-running-the-step
#
# is_always_run: false
# is_skippable: false
# run_if: ""

# Use the `deps` property to declare dependencies that you can fetch from an OS dependency manager.
# You can find more information about this in the documentation here:
# https://devcenter.bitrise.io/en/steps-and-workflows/developing-your-own-bitrise-step/developing-a-new-step.html#submodules-and-step-dependencies
#
# deps:
#   brew:
#   - name: cmake
#   apt_get:
#   - name: cmake


toolkit:
  go:
    package_name: github.com/bitrise-io/bitrise-step-dependency-installer


inputs:
  - tool_version_file: .tool-versions
    opts:
      title: "Tool Version File Path"
      summary: The tool version file path.
      description: |
        The tool version file contains the version(s) of the tool(s) for the step to install. See the step description for the list of supported tool version files.
      is_expand: false
      is_required: true
      value_options: []
  - verbose: false
    opts:
      title: "Verbose Output"
      summary: Enable verbose output for debugging.
      description: |
        If enabled, the step will output additional debug information during execution.
      is_expand: false
      is_required: false
      value_options:
        - true
        - false
  - bitrise_workflow_id: ""
    opts:
      title: "Bitrise Workflow ID"
      summary: The Bitrise Workflow ID to use for installing tools. Optional.
      description: |
        This input is only used when passing a bitrise.yml file as a tool version file and rather than using the global `tools:` block, you want to use the `tools:` block defined under specific workflows.
        The step accepts a workflow ID and installs the tools defined under that workflow's `tools:` block.
      is_expand: false
      is_required: false
      value_options: []